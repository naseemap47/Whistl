name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "feat/ui" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0' }}"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Whistl.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Whistl-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name || 'v1.0' }}
          name: "Whistl ${{ github.ref_name || github.event.inputs.tag_name || 'v1.0' }}"
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
